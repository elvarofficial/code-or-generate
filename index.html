<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Code it or generate it? 25 game assets, both ways</title>
<meta name="description" content="The same 25 game assets, made twice: Claude Opus 5.5 writing three.js code and the Tripo API generating from the same concept images. Switch between them.">
<meta property="og:type" content="website">
<meta property="og:title" content="Code it or generate it? 25 game assets, both ways">
<meta property="og:description" content="Same concept sheets, same camera, same light. One button flips every asset between Code and Tripo API.">
<meta property="og:image" content="https://code-or-generate.vercel.app/site/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Code it or generate it? 25 game assets, both ways">
<meta name="twitter:description" content="Same concept sheets, same camera, same light. One button flips every asset between Code and Tripo API.">
<meta name="twitter:image" content="https://code-or-generate.vercel.app/site/og.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111217'/%3E%3Cpath d='M16 6l9 5v10l-9 5-9-5V11z' fill='none' stroke='%23ffb24a' stroke-width='2.4' stroke-linejoin='round'/%3E%3Cpath d='M16 16l9-5M16 16v10M16 16l-9-5' stroke='%2374c6ff' stroke-width='2' /%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site/style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
    "three/examples/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/"
  }
}
</script>
</head>
<body class="tripo">
<canvas id="stage"></canvas>
<div class="vignette"></div>

<header class="top">
  <div class="title">
    <h1>Code it or generate it?</h1>
    <p>25 game assets in 5 tiers, both ways. Same concept sheets, same camera, same light.</p>
  </div>
  <div class="controls">
  <button class="mesh" id="mesh" aria-pressed="false" title="Show the triangles">Mesh</button>
  <div class="switch" role="tablist" aria-label="Route">
    <span class="pill"></span>
    <button role="tab" data-route="code" aria-selected="false">Code</button>
    <button role="tab" data-route="tripo" aria-selected="true">Tripo API</button>
  </div>
  </div>
</header>

<div id="labels"></div>

<aside class="card" id="card" aria-hidden="true">
  <button class="close" id="close" aria-label="Back to all 25">&#x2715;</button>
  <div class="card-head">
    <span class="num" id="card-num">01</span>
    <h2 id="card-name">Crate</h2>
    <p id="card-tests">Boxes and straight edges</p>
  </div>
  <div class="routes">
    <div class="col" data-col="code"><h3>Code</h3><dl></dl></div>
    <div class="col" data-col="tripo"><h3>Tripo API</h3><dl></dl></div>
  </div>
  <div class="ref" id="card-ref"></div>
  <figure class="studio" id="card-studio"></figure>
</aside>

<nav class="dots" id="dots" aria-label="Assets"></nav>

<div class="reel-ui" id="reel" aria-hidden="true">
  <div class="rh"><span class="rn">01 / 06</span><span class="rt">Crate</span></div>
  <div class="rr"><span data-r="code">Code</span><i></i><span data-r="tripo" class="on">Tripo API</span></div>
</div>

<footer class="foot">
  <span class="links"><a href="results.csv">results.csv</a></span>
</footer>

<div class="loader" id="loader">
  <div class="loader-inner">
    <div class="loader-title">Loading models</div>
    <div class="bar"><i id="bar"></i></div>
  </div>
</div>

<script type="module" src="site/app.js"></script>
</body>
</html>
