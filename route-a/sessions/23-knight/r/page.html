<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const { createKnight } = await import('/23-knight/route-a/23-knight.js?v=' + Date.now());
const S=1024;
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setSize(S,S); renderer.setClearColor(0xffffff,1);
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=0.8; renderer.toneMappingExposure=0.8; renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();
scene.environment=new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),0.04).texture;
scene.environmentIntensity=0.55;
scene.add(new THREE.HemisphereLight(0xffffff,0x887766,0.9));
const dl=new THREE.DirectionalLight(0xffffff,1.8); dl.position.set(3,8,6); scene.add(dl);
const obj=createKnight(); scene.add(obj);
let tris=0; const by={}; obj.traverse(o=>{if(o.isMesh){const g=o.geometry; const t=(g.index?g.index.count:g.attributes.position.count)/3; tris+=t; const k=(o.parent.name||'')+':'+g.type; by[k]=(by[k]||0)+t;}}); console.log(JSON.stringify(by));
// views: [refName, camera pos dir, image center px, ground px]
const views={front:[[0,0,1],568,955],left:[[1,0,0],531,940],back:[[0,0,-1],477,945]};
const out={tris};
async function loadImg(src){const i=new Image();i.src=src;await i.decode();return i;}
for(const [name,[d,cx,gy]] of Object.entries(views)){
  const u=100; // px per unit
  const cam=new THREE.OrthographicCamera(-cx/u,(S-cx)/u,gy/u,(gy-S)/u,0.1,100);
  cam.position.set(d[0]*30,0,d[2]*30); cam.up.set(0,1,0); cam.lookAt(0,0,0);
  renderer.render(scene,cam);
  const ref=await loadImg('/23-knight/assets/23-knight/'+name+'.png');
  const c=document.createElement('canvas'); c.width=S*3; c.height=S; const g=c.getContext('2d');
  g.drawImage(ref,0,0); g.drawImage(renderer.domElement,S,0);
  g.globalAlpha=0.5; g.drawImage(ref,2*S,0); g.drawImage(renderer.domElement,2*S,0); g.globalAlpha=1;
  out[name]=c.toDataURL('image/png');
}
window.__out=out;
</script></body></html>
